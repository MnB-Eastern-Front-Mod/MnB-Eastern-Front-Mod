    particle.sprite = "rpg43"
    particle.velocity = 450
    particle.rotationz = rotationz
    particle.innerRotation = rotationz
    particle.spin = 0
    particle.lifeSpan = 4
    particle.faction = 0
    particle.nextFrame = ""
    particle.x = x
    particle.y = y 
    particle.xoffset = 20
    particle.yoffset = 20
    particle.drag = 1
    particle.alpha = 255
    particle.fade = 0
    particle.expand = 0
    --will be assigned in the action 
    particle.targetx = 0
    particle.targety = 0
    particle.lob = 0
    particle.immunity = 1
