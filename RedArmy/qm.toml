# qm.toml: changes to game code, for what faction.toml can't do.
# Grenades, the bipod cooldown, rank names and image sizes, the promotion texts and the
# Assault Sapper's bonus are in faction.toml.
# Guide: QuarterMaster modding wiki, Part 4.

[manifest]
version = "1.0.0"


# ============================== INTRO ==============================

[[pattern]]
id = "eastern_front:intro_loaded"
name = "Intro: 'Red Army Mod loaded!'"
group = "Intro"
target = "includes/drawFiles.lua"
pattern = 'love.graphics.print("URB and the MNB community presents", 500, 490)'
position = "after"
match_indent = true
payload = '''
love.graphics.setColor( love.math.colorFromBytes(190, 190, 190, textFade))
love.graphics.print("Red Army Mod loaded!", 500, 525)
'''

[[pattern]]
id = "eastern_front:intro_date"
name = "Intro: the date"
group = "Intro"
target = "includes/drawFiles.lua"
pattern = 'love.graphics.printf({{love.math.colorFromBytes(255,255,255,255)}, "June 6, 1944"}, 0, 250, 1280, "center")'
position = "at"
match_indent = true
payload = '''
love.graphics.printf({{love.math.colorFromBytes(255,255,255,255)}, "October 24, 1943"}, 0, 250, 1280, "center")
'''

[[pattern]]
id = "eastern_front:intro_unit"
name = "Intro: the unit"
group = "Intro"
target = "includes/drawFiles.lua"
pattern = 'love.graphics.printf({{love.math.colorFromBytes(255,255,255,255)}, "Company C, 116th Regiment, 29th div"}, 0, 400, 1280, "center")'
position = "at"
match_indent = true
payload = '''
love.graphics.printf({{love.math.colorFromBytes(255,255,255,255)}, "Razvedvzvod, 117th Guards Rifle Regiment, 39th Guards Rifle Division, 8th Guards Army, 3rd Ukrainian Front"}, 0, 400, 1280, "center")
'''


# ============================== PROMOTIONS ==============================
# Each promotion gives +5 combat skill (vanilla: +5, +10, +15). The rank line is part of the
# pattern, so the Sniper's +15 class bonus elsewhere is left alone.
[[pattern]]
id = "eastern_front:promotion_skill_2"
name = "Promotion to rank 2: +5 combat skill"
group = "Promotions"
target = "includes/urb_engine.lua"
pattern = '''
elseif(player.deployedTroops[convertedId(specID)].rank == 2) then
player.deployedTroops[convertedId(specID)].skill = player.deployedTroops[convertedId(specID)].skill + 10
'''
position = "at"
match_indent = true
times = 1
payload = '''
elseif(player.deployedTroops[convertedId(specID)].rank == 2) then
  player.deployedTroops[convertedId(specID)].skill = player.deployedTroops[convertedId(specID)].skill + 5
'''

[[pattern]]
id = "eastern_front:promotion_skill_3"
name = "Promotion to rank 3: +5 combat skill"
group = "Promotions"
target = "includes/urb_engine.lua"
pattern = '''
elseif(player.deployedTroops[convertedId(specID)].rank == 3) then
player.deployedTroops[convertedId(specID)].skill = player.deployedTroops[convertedId(specID)].skill + 15
'''
position = "at"
match_indent = true
times = 1
payload = '''
elseif(player.deployedTroops[convertedId(specID)].rank == 3) then
  player.deployedTroops[convertedId(specID)].skill = player.deployedTroops[convertedId(specID)].skill + 5
'''


# ============================== PRIMARY AT RIFLES ==============================
# In the vanilla game an AT rifle is an extra item: it has 10 shots (atRifleShot), never
# reloads, and the soldier goes back to his own gun when it is empty.
# A PRIMARY AT rifle is a soldier's main weapon: it uses weapon.ammo and reloads like any gun.
# It is marked with   weapon.primaryAT = true   (set in hooks.lua, by weapon tag).
# Item AT rifles (the Boys and PzB 39 pickups) are untouched.
# The patches go into both firing functions: includes/urb_engine.lua (shooting at soldiers)
# and includes/ai.lua (shooting at vehicles).

# May he fire? A primary AT rifle needs ammo in the weapon, not atRifleShot.
[[regex]]
id = "eastern_front:primary_at_can_fire"
name = "Primary AT rifle: fires on its own ammo"
group = "Primary AT rifles"
target = ["includes/urb_engine.lua", "includes/ai.lua"]
pattern = '\(\(player\.deployedTroops\[idz\]\.weapon\.ammo > 0 and player\.deployedTroops\[idz\]\.weapon\.class ~= "atRifle"\) or \(player\.deployedTroops\[idz\]\.weapon\.class == "atRifle" and player\.deployedTroops\[idz\]\.atRifleShot > 0\)\)'
position = "at"
payload = '((player.deployedTroops[idz].weapon.ammo > 0 and (player.deployedTroops[idz].weapon.class ~= "atRifle" or player.deployedTroops[idz].weapon.primaryAT)) or (player.deployedTroops[idz].weapon.class == "atRifle" and not player.deployedTroops[idz].weapon.primaryAT and player.deployedTroops[idz].atRifleShot > 0))'
times = 1

# After a shot: a primary AT rifle loses one round from the weapon, like any other gun.
[[pattern]]
id = "eastern_front:primary_at_uses_ammo"
name = "Primary AT rifle: a shot costs weapon ammo"
group = "Primary AT rifles"
target = ["includes/urb_engine.lua", "includes/ai.lua"]
pattern = '''
if(player.deployedTroops[idz].weapon.class == "atRifle") then
player.deployedTroops[idz].atRifleShot = player.deployedTroops[idz].atRifleShot - 1
'''
position = "at"
apply_as = "edits"
match_indent = true
times = 1
payload = '''
if(player.deployedTroops[idz].weapon.class == "atRifle" and not player.deployedTroops[idz].weapon.primaryAT) then
  player.deployedTroops[idz].atRifleShot = player.deployedTroops[idz].atRifleShot - 1
'''

# Out of ammo: a primary AT rifle reloads instead of being thrown away.
[[pattern]]
id = "eastern_front:primary_at_reloads"
name = "Primary AT rifle: reloads when empty"
group = "Primary AT rifles"
target = ["includes/urb_engine.lua", "includes/ai.lua"]
pattern = '''
if(player.deployedTroops[idz].weapon.class == "atRifle") then
if(player.deployedTroops[idz].atRifleShot <= 0) then
'''
position = "at"
apply_as = "edits"
match_indent = true
times = 1
payload = '''
if(player.deployedTroops[idz].weapon.class == "atRifle" and not player.deployedTroops[idz].weapon.primaryAT) then
  if(player.deployedTroops[idz].atRifleShot <= 0) then
'''

# The "N shots left" text is for item AT rifles only.
[[regex]]
id = "eastern_front:primary_at_no_shots_left_text"
name = "Primary AT rifle: no 'shots left' text"
group = "Primary AT rifles"
target = ["includes/urb_engine.lua", "includes/ai.lua"]
pattern = 'floatyText\(player\.deployedTroops\[idz\], player\.deployedTroops\[idz\]\.atRifleShot\.\." shots left"\)'
position = "at"
payload = 'if(not player.deployedTroops[idz].weapon.primaryAT) then floatyText(player.deployedTroops[idz], player.deployedTroops[idz].atRifleShot.." shots left") end'
times = 1

# The game gives the Boys two effects by its tag: it smashes light cover, and its hits on
# vehicles burst. Primary AT rifles get both too.
[[regex]]
id = "eastern_front:primary_at_boys_effects"
name = "Primary AT rifle: Boys hit effects"
group = "Primary AT rifles"
target = "includes/urb_engine.lua"
pattern = 'shooter\.weapon\.tag == "boysRifle"'
position = "at"
payload = '(shooter.weapon.tag == "boysRifle" or shooter.weapon.primaryAT)'
times = 2


# ============================== SUPPRESSED WEAPONS ==============================
# In the vanilla game only the Sten MkVI (by its tag) can fire without breaking the stealth
# or camo buff. Each shot rolls: 5% per enemy who can see the shooter to be revealed.
# A weapon marked with   weapon.suppressed = true   (set in hooks.lua, by weapon tag)
# gets the same roll. based_on = "stenMKVI" alone does not do it.
[[regex]]
id = "eastern_front:suppressed_keeps_stealth"
name = "Suppressed weapons: firing can keep stealth"
group = "Suppressed weapons"
target = "includes/urb_engine.lua"
pattern = 'player\.deployedTroops\[idz\]\.weapon\.tag ~= "stenMKVI" or stenStealth'
position = "at"
payload = '(player.deployedTroops[idz].weapon.tag ~= "stenMKVI" and not player.deployedTroops[idz].weapon.suppressed) or stenStealth'

# ============================== PWM GRENADE ==============================

[[pattern]]
id = "eastern_front:pwm_explosion"
name = "PWM: improved Faust explosion"
group = "PWM"
target = "includes/urb_engine.lua"
pattern = 'createExplosion("contactExplosion", x, y)'
position = "at"
match_indent = true
times = 1
payload = '''
createExplosion("faustExplosion", x, y)
'''

[[pattern]]
id = "eastern_front:pwm_no_spin"
name = "PWM: face throw direction without spinning"
group = "PWM"
target = "includes/particlesSystem.lua"
pattern = '''
elseif(typez == "contactGrenadePart") then
    --particle, typez, x, y, rotationz
    particle.typez = "contactGrenade"
    particle.sprite = "contactFragPart"
    particle.velocity = 600
    particle.rotationz = rotationz
    particle.innerRotation = 0
    particle.spin = randNbr(5)/10
'''
position = "at"
match_indent = true
times = 1
payload = '''
elseif(typez == "contactGrenadePart") then
    --particle, typez, x, y, rotationz
    particle.typez = "contactGrenade"
    particle.sprite = "contactFragPart"
    particle.velocity = 500
    particle.rotationz = rotationz
    particle.innerRotation = rotationz
    particle.spin = 0
'''

[[pattern]]
id = "eastern_front:pwm_throw_range"
name = "PWM: cap throw distance at 650"
group = "PWM"
target = "includes/urb_engine.lua"
pattern = 'function throwContactGrenade(dude, gear, x, y)'
position = "after"
match_indent = true
times = 1
payload = '''
  local thrower = player.deployedTroops[dude]
  local dx = x - thrower.x
  local dy = y - thrower.y
  local distance = math.sqrt(dx * dx + dy * dy)
  local maxDistance = 650

  if distance > maxDistance then
    x = thrower.x + dx * maxDistance / distance
    y = thrower.y + dy * maxDistance / distance
  end
'''
times = 1
