# LIMONKA IMPLEMENTATION
# (BY HAND)
# We should codify exactly what is needed first:
  # start all modded prompts from 1001 onwards?
  # okay now we inject that mousePrompt 1001 calls custom func 
  # limonkaToss(x,y) 
  # this has grenade type 1001 because i love consistency 
  # ai.lua reads grenade type 1001 and then says, hey i know what that is, thats our limonka!!!
  # over to urb_engine
  # over now to particle.lua addParticle
  # particleUpdate(dt) manages the inflight frag
  # new limonkaBlast in urb_engine
  # new createExplosion if-else table for limonkaExplosion



# Strelok-1: Skill --> mousePrompt 1001
# Replaces the whole AP rounds block, so its buff sound and voice line don't play and the
# cooldown doesn't start on the click. The cooldown starts at the throw, in limonkaToss.
[[patches]]
[patches.pattern]
id = "rkka:strelok1frag_0"
target = "includes/urb_engine.lua"
pattern = """
buffer(player.deployedTroops[convertedId(specID)], "AP rounds")
-- play a lil buff sound
local buff_sfx2
--load the proper sound for the gun
buff_sfx2 = buffSound:clone()
buff_sfx2:play()
player.deployedTroops[convertedId(specID)].skill1Timer = 180
--
local clone_sfx4
clone_sfx4 = _G["apTalk"..randNbr(6)]:clone()
clone_sfx4:setVolume(stepScale(player.deployedTroops[convertedId(specID)])/3)
clone_sfx4:setPitch( ((90 + randNbr(10))/100))
clone_sfx4:play()
"""
position = "at"
match_indent = true
times = 1
payload = """
mousePrompt = 1001
mousePrompter = specID
mousePromptLock = 1
"""

# now we r doing the throw range confirm part. 
# MaxRange now 800. grenadeType 1001.
[[patches]]
[patches.pattern]
id = "rkka:strelok1frag_1"
target = "includes/urb_engine.lua"
pattern = 'function performFragToss(x,y)'
position = "before"
payload = '''
function limonkaToss(x,y)
  local foo = convertedId(mousePrompter) 
  if(foo ~= -1) then 
    if(player.deployedTroops[foo].death ~= 1 and player.deployedTroops[foo].health > 10) then
      player.deployedTroops[foo].targetx = player.deployedTroops[foo].x 
      player.deployedTroops[foo].targety = player.deployedTroops[foo].y
      local fragShot = distanceCheck(player.deployedTroops[foo].x, player.deployedTroops[foo].y, x+player.screenx, y+player.screeny)
      local maxRange = 800 
      if(hasPerk(player.deployedTroops[foo], 1)) then --slugger for sure
       maxRange = maxRange * 1.15
      end
      if(fragShot < maxRange and player.deployedTroops[foo].pinned ~= 1 ) then 
        fragShot = fragShot/8 -- rkkamod so error propagates by distance but there is NO need to reuse the same var here like WHAT is the confusion here gang
        player.deployedTroops[foo].state = "fragThrow1"
        player.deployedTroops[foo].fragx = x+player.screenx + (randNbr(fragShot*2)-fragShot)
        player.deployedTroops[foo].fragy = y+player.screeny + (randNbr(fragShot*2)-fragShot) --error yeah
        player.deployedTroops[foo].grenadeType = 1001
        player.deployedTroops[foo].stateTimer = 0.1
        player.deployedTroops[foo].actionTimer = 5
        player.deployedTroops[foo].targetPointer = 0
        player.deployedTroops[foo].skill1Timer = 90 -- Limonka cooldown (seconds), Strelok skill 1
      else
        local clone_sfx4 
        clone_sfx4 = _G["neg"..randNbr(15)]:clone()
        clone_sfx4:setVolume(stepScale(player.deployedTroops[foo])/2.3)
        clone_sfx4:setPitch( ((90 + randNbr(10))/100)) 
        clone_sfx4:play()
        if(fragShot > 999) then 
          player.textCue[#player.textCue+1] = {}
          player.textCue[#player.textCue].name = tooFarTxt
          player.textCue[#player.textCue].x = x
          player.textCue[#player.textCue].y = y
          player.textCue[#player.textCue].alpha = 255
        end
      end
    end
  end
  buttoned = 1
  --reinitialize all that shit
  abilityDisplay = 0
  mousePrompter = 0
  specID = -99
  mousePrompt = 0
end
'''

