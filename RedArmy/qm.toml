# nextphase: throwLimonka() in engine.
[[patches]]
[patches.pattern]
id = "rkka:strelok1frag_3"
target = "includes/urb_engine.lua"
pattern = 'function throwFrag(dude, gear, x, y)'
position = "before"
payload = '''
function throwLimonka(dude, gear, x, y)
    player.deployedTroops[dude].rotation = math.atan2(player.deployedTroops[dude].y -(y ), player.deployedTroops[dude].x-(x ))+ 1.5  
  newPart = {}
    addParticle(newPart, "limonka",  player.deployedTroops[dude].x, player.deployedTroops[dude].y, player.deployedTroops[dude].rotation)

  table.insert(player.particles, newPart)
  if(player.deployedTroops[dude].faction == 1) then 
    player.particles[#player.particles].targetx = x 
    player.particles[#player.particles].targety = y 
  else
    player.particles[#player.particles].targetx = x 
    player.particles[#player.particles].targety = y 
  end
  -- set the mid point 
  player.particles[#player.particles].lob = distanceCheck(player.particles[#player.particles].x, player.particles[#player.particles].y, player.particles[#player.particles].targetx, player.particles[#player.particles].targety)
  --if the guy is inside we prevent the grande to bounce out
  if(insideBunker(player.deployedTroops[dude]) or coveredBuilding(player.deployedTroops[dude])) then
    player.particles[#player.particles].wallImmune = 0.3
  end
 -- print("particle type "..player.particles[#player.particles].typez.." lob is "..player.particles[#player.particles].lob)
  -- play animation
  player.deployedTroops[dude].state = "idle"
  player.deployedTroops[dude].aim = 0
  --player.deployedTroops[dude].pinned = 1
  player.deployedTroops[dude].stateTimer = 0.5
  player.deployedTroops[dude].actionTimer = 1
  player.deployedTroops[dude].targetPointer = 0
  player.deployedTroops[dude].temporaryStop = 1
  player.deployedTroops[dude].frags = player.deployedTroops[dude].frags - 1
  -- resets
  clone_sfx = tossFrag:clone()
  clone_sfx:setVolume(stepScale(player.deployedTroops[dude]))
  clone_sfx:play()
end
'''
# back to the particle engine!!!
# note velocity cut down to 450 px
[[patches]]
[patches.pattern]
id = "rkka:strelok1frag_4"
target = "includes/particlesSystem.lua"
pattern = '  elseif(typez == "fragGrenade2") then '
position = "before"
payload = '''
  elseif(typez == "limonka") then
    --particle, typez, x, y, rotationz
    -- typez "fragGrenade" gives it the vanilla frag's flight: size capped during the lob,
    -- no growth on landing, bounce sound. The sprite picks the blast (see strelok1frag_6).
    particle.typez = "fragGrenade"
    particle.sprite = "limonka"
    particle.velocity = 450
    particle.rotationz = rotationz
    particle.innerRotation = 0
    particle.spin = randNbr(10)/10 -- vanilla frag spin
    particle.lifeSpan = 4
    particle.faction = 0
    particle.nextFrame = ""
    particle.x = x
    particle.y = y 
    particle.xoffset = 20
    particle.yoffset = 20
    particle.drag = 1
    particle.alpha = 255
    particle.fade = 0
    particle.expand = 0
    --will be assigned in the action 
    particle.targetx = 0
    particle.targety = 0
    particle.lob = 0
    particle.immunity = 1
'''
